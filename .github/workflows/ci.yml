name: CI

# Native targets only. rust-toolchain.toml does not set targets = [...] —
# adding a cross-compile job requires amending that file first.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - '_bmad/**'
      - '_bmad-output/**'
  pull_request:
    paths-ignore:
      - '_bmad/**'
      - '_bmad-output/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Free ~30 GB on Linux runners (android SDK, .NET, Haskell, Docker images).
      # Mitigates the os-error-28 disk-space failure observed on run 25066598887
      # before this patch landed. tool-cache excluded (Rust toolchain installs
      # there); large-packages excluded (~5 min cost, not needed at our scale).
      - name: Free disk space (Linux only)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # cargo test builds + runs tests on all 3 OSes (platform parity for tests).
      # The standalone `cargo build` step was removed — it produced a duplicate
      # link of the app binary that `cargo test` does not need.
      - name: cargo test
        run: cargo test --locked

      - name: cargo clippy (Linux only)
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo fmt --check (Linux only)
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

  msrv-check:
    name: msrv-check (rust 1.89, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: "1.89"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv

      - name: cargo check (MSRV)
        run: cargo check --locked
